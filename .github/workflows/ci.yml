name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Authoritative run: Hermes Agent currently requires Python 3.14 (its
  # pyproject.toml says ``# we *only* support 3.14``; the ``>=3.11,<3.15``
  # range exists only so older installs can run the updater and reach
  # 3.14). Anything that fails here is a real failure.
  test:
    name: Tests + manifest lint (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # pyyaml is required by the manifest-validation steps below
          # (the plugin itself is stdlib-only — these deps are CI-only).
          python -m pip install pytest pytest-mock pyyaml

      - name: Byte-compile sources (catches syntax errors fast)
        run: |
          python -m py_compile __init__.py frihet.py
          python -m py_compile tests/test_frihet.py tests/test_plugin_discovery.py

      - name: Run unit tests
        env:
          # Make sure tests don't leak real credentials.
          FRIHET_API_KEY: ""
          FRIHET_MCP_URL: ""
        run: python -m pytest -q

      - name: Validate plugin.yaml against the schema
        run: |
          python - <<'PY'
          """Schema sanity check for plugin.yaml — mirrors what
          ``hermes plugins validate`` does without requiring Hermes itself
          in CI. The actual admission test runs on a Hermes-enabled
          runner for PRs to NousResearch/hermes-agent."""
          import re, sys, yaml, pathlib
          manifest = yaml.safe_load(pathlib.Path("plugin.yaml").read_text())
          required = ["name", "version", "description", "author", "kind"]
          missing = [k for k in required if not manifest.get(k)]
          if missing:
              print(f"FAIL: plugin.yaml missing {missing}", file=sys.stderr)
              sys.exit(1)
          for field in ("provides_tools", "provides_hooks", "provides_middleware", "requires_env"):
              if manifest.get(field) is not None and not isinstance(manifest[field], list):
                  print(f"FAIL: {field} must be a list", file=sys.stderr)
                  sys.exit(1)
          spec = str(manifest.get("requires_hermes") or "").strip()
          if spec and not re.match(r"^>=\d+\.\d+", spec):
              print(f"FAIL: requires_hermes spec {spec!r} does not start with '>='", file=sys.stderr)
              sys.exit(1)
          for entry in manifest.get("requires_env") or []:
              if not re.match(r"^[A-Z][A-Z0-9_]*$", entry):
                  print(f"FAIL: requires_env entry {entry!r} is not UPPER_SNAKE_CASE", file=sys.stderr)
                  sys.exit(1)
          print(f"OK: plugin.yaml validates (name={manifest['name']}, version={manifest['version']})")
          PY

      - name: Validate upstream MCP manifest (yaml well-formed)
        run: |
          test -f upstream/frihet-mcp-manifest.yaml || (echo "FAIL: upstream/frihet-mcp-manifest.yaml missing" && exit 1)
          python - <<'PY'
          import sys, yaml, pathlib
          data = yaml.safe_load(pathlib.Path("upstream/frihet-mcp-manifest.yaml").read_text())
          for k in ("manifest_version", "name", "transport", "auth"):
              if k not in data:
                  print(f"FAIL: upstream manifest missing {k!r}", file=sys.stderr); sys.exit(1)
          if data["transport"].get("type") != "http":
              print(f"FAIL: upstream transport must be http, got {data['transport'].get('type')!r}", file=sys.stderr); sys.exit(1)
          if data["auth"].get("type") not in ("oauth", "oauth_pkce"):
              print(f"FAIL: upstream auth must be oauth, got {data['auth'].get('type')!r}", file=sys.stderr); sys.exit(1)
          print(f"OK: upstream manifest validates (name={data['name']})")
          PY

      - name: Verify skill is present
        run: |
          test -f skills/frihet/SKILL.md || (echo "FAIL: skills/frihet/SKILL.md missing" && exit 1)
          head -1 skills/frihet/SKILL.md | grep -q "^---$" || (echo "FAIL: SKILL.md missing frontmatter" && exit 1)
          echo "OK: skill present"

      - name: Verify LICENSE is MIT
        run: |
          head -3 LICENSE | grep -q "MIT License" || (echo "FAIL: LICENSE missing MIT header" && exit 1)
          echo "OK: license is MIT"

      - name: Verify no secrets committed
        run: |
          # The .gitignore should keep .env files out of the repo.
          grep -q "^\.env$" .gitignore || (echo "FAIL: .gitignore missing .env rule" && exit 1)
          echo "OK: secrets not committed"

  # Non-blocking compatibility smoke test: confirms the plugin still
  # byte-compiles and runs under older Python versions in Hermes's
  # declared range ``>=3.11,<3.15``. The 3.11/3.12/3.13 slots exist
  # because Hermes's updater contract needs them, NOT because we treat
  # them as supported runtimes for the plugin itself.
  compat-smoke:
    name: Compatibility smoke (3.11/3.12/3.13)
    runs-on: ubuntu-latest
    # ``continue-on-error`` so a failure here does not block the PR — the
    # authoritative 3.14 run above already gates the release.
    continue-on-error: true
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-mock pyyaml
      - name: Run unit tests
        env:
          FRIHET_API_KEY: ""
          FRIHET_MCP_URL: ""
        run: python -m pytest tests/test_frihet.py -q

  hermes-validate:
    name: Hermes plugin manifest validate (CI gate)
    runs-on: ubuntu-latest
    # Load-bearing CI gate: runs on every push and every PR. Mirrors what
    # ``hermes plugins validate`` does without requiring Hermes itself
    # installed on the runner — the catalog maintainer runs the
    # full admission test on a Hermes-enabled runner for the upstream PR.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Validate plugin.yaml (schema + field types + env keys)
        run: |
          python - <<'PY'
          """Mirrors ``hermes plugins validate`` for the parts that do not
          require a live Hermes runtime: schema, field types, requires_env
          shape, version semantics, and irreversible-pattern declarations.
          The actual Hermes admission runs on a Nous-hosted runner.
          """
          import re, sys, yaml, pathlib

          fail = []
          manifest = yaml.safe_load(pathlib.Path("plugin.yaml").read_text())

          # Required fields.
          for k in ("name", "version", "description", "author", "kind"):
              if not manifest.get(k):
                  fail.append(f"missing required field: {k}")

          # List-typed fields.
          for fld in ("provides_tools", "provides_hooks", "provides_middleware", "requires_env"):
              v = manifest.get(fld)
              if v is not None and not isinstance(v, list):
                  fail.append(f"{fld} must be a list, got {type(v).__name__}")

          # requires_hermes version spec.
          spec = str(manifest.get("requires_hermes") or "").strip()
          if spec and not re.match(r"^>=\d+\.\d+", spec):
              fail.append(f"requires_hermes spec {spec!r} must start with '>='")

          # requires_env entries UPPER_SNAKE_CASE.
          for entry in manifest.get("requires_env") or []:
              if not re.match(r"^[A-Z][A-Z0-9_]*$", entry):
                  fail.append(f"requires_env entry {entry!r} is not UPPER_SNAKE_CASE")

          # Capability declaration cross-check (load plugin module).
          sys.path.insert(0, ".")
          import importlib.util
          spec_mod = importlib.util.spec_from_file_location("frihet_mod", "__init__.py")
          mod = importlib.util.module_from_spec(spec_mod)
          spec_mod.loader.exec_module(mod)
          # We can probe the dispatcher surface without invoking it: it
          # must expose ``_pre_tool_call`` and a register() that registers
          # one pre_tool_call hook.
          if not callable(getattr(mod, "_pre_tool_call", None)):
              fail.append("__init__.py must expose _pre_tool_call callable")

          # Frihet safety table must list createPayment as irreversible.
          spec_frihet = importlib.util.spec_from_file_location("frihet_pkg", "frihet.py")
          frihet = importlib.util.module_from_spec(spec_frihet)
          spec_frihet.loader.exec_module(frihet)
          if "createPayment" not in frihet.IRREVERSIBLE_PATTERNS:
              fail.append("createPayment must be in IRREVERSIBLE_PATTERNS")

          # Catalogue-upstream manifest cross-check.
          up_data = yaml.safe_load(
              pathlib.Path("upstream/frihet-mcp-manifest.yaml").read_text()
          )
          for k in ("manifest_version", "name", "transport", "auth"):
              if k not in up_data:
                  fail.append(f"upstream manifest missing {k}")
          if up_data.get("transport", {}).get("type") != "http":
              fail.append("upstream transport must be http")
          if up_data.get("auth", {}).get("type") not in ("oauth", "oauth_pkce"):
              fail.append("upstream auth must be oauth/oauth_pkce")

          if fail:
              for line in fail:
                  print(f"FAIL: {line}", file=sys.stderr)
              sys.exit(1)
          print(f"OK: hermes-validate passed (name={manifest['name']}, version={manifest['version']})")
          PY