name: frihet
repo: https://github.com/Frihet-io/hermes-frihet
# Pinned SHA — Frihet-io/hermes-frihet @ v0.1.0 (feat(doctor): honour
# the Hermes OAuth token cache when no API key is set). 75 tests green,
# hermes plugins validate --install-deps 15/15, security scan safe.
sha: f3312087a8acda01ee3a5b089017f2a2657d2d5c
description: "Official Hermes Agent integration for Frihet — discoverability, setup, diagnostics, and operating guidance for the Frihet MCP. Zero duplicated tools; the canonical 158-operation Frihet surface stays in @frihet/mcp-server and the remote endpoint https://mcp.frihet.io/mcp."
maintainer: Frihet-io
tier: community
category: tools
docs_url: https://github.com/Frihet-io/hermes-frihet#readme
requires_hermes: ">=0.21.5"
version: "0.1.0"
# Capabilities mirror plugin.yaml exactly.
# Provides zero Python tools on purpose: the canonical Frihet surface
# (158 operations) lives in @frihet/mcp-server and is reached via the
# native Hermes MCP client. The plugin adds:
#   - a skill (skills/frihet/SKILL.md) that encodes the operating contract
#   - a pre_tool_call hook that escalates irreversible Frihet operations
#     to the human approval gate
#   - a /frihet slash command for setup/status/doctor
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  # No env vars required. Credentials (Bearer API key or OAuth 2.0+PKCE)
  # live on the ``mcp_servers.frihet`` block in the user's config.yaml,
  # not on the plugin itself.
  requires_env: []